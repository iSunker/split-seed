# =====================================================================
# 大包拆包 · 单种保种  —— 服务栈
#   prowlarr        : 把你的 PT 站变成 Torznab，供 cross-seed 搜索
#   flaresolverr    : (可选) 过 Cloudflare，中文 NexusPHP 站常需要
#   cross-seed      : 按内容匹配单种 → 在 linkDir 建硬链接 → 注入 :3060
#   reseed-orchestrator : 我们写的编排器(一次性 CLI)，预检/驱动/汇报
#
# 注意：qbittorrent-reseed(:3060) 由它自己的 compose 单独运行，不在本栈内。
#       本栈**接入它所在的 docker 网络**(qbit-net = qbittorrent-reseed_default)，
#       用服务名直连 http://qbittorrent-reseed:3060。
#       ★ 不要改回 http://${NAS_IP}:3060 —— 群晖上「容器 → 宿主机 LAN IP → DNAT 回
#         另一容器」会 timeout（2026-09-11 实测）。
#       （宿主机上跑的 drive-loop.py 走的是另一条路：LAN IP + 端口映射；
#         两边是**故意不同**的，别互相纠正。）
#
# 用法：
#   docker compose up -d prowlarr flaresolverr        # Phase 1
#   docker compose up -d cross-seed                   # Phase 2
#   docker compose build reseed-orchestrator          # Phase 3
#   docker compose run --rm reseed-orchestrator preflight
#   docker compose run --rm reseed-orchestrator run --job frds-top250-2024 --dry-run
#
# ★ 关于 logging（2026-09-12 加）
# ---------------------------------
# 四个服务原先**都没有 logging 段** —— 走 Docker 默认的 json-file 驱动，
# 而它**默认没有任何上限**（除非全局 daemon.json 另配过）。也就是说这些容器会
# 一直往 /volume2/@docker/containers/*/*-json.log 里写、永不清理。
#
# 为什么这条要单独拿出来说：本项目其余日志其实**都已经在自我轮转**——
#   ① drive-loop.log        RotatingFileHandler(5MB × 5)        ≈ 30 MB 上限
#   ② cross-seed/logs/*     按天轮转 + 保留 14 天                ≈ 0.9 GB 稳态
#   ③ notify/log/*.tsv      不清，但一天 137 字节                ≈ 50 KB/年
# 所以**容器日志才是唯一没上限的那个**（NAS 的 /volume1 只剩约 20 GB）。
# 照"给日志加轮转"的直觉去动 ①②，等于做一个**已经存在的东西**。
#
# 10m × 3 = 每个容器上限 30 MB，四个合计 ~120 MB（相对现在的"无上限"是质变）。
# ⚠ 改这里**必须 `--force-recreate` 才生效** —— `restart` 不重新读 compose 配置。
#   sudo docker compose up -d --force-recreate
# 验证：sudo docker inspect --format '{{.HostConfig.LogConfig}}' reseed-cross-seed
# =====================================================================

# 四个服务共用同一份日志上限。★ 用 YAML 锚点（而不是抄四遍）是为了**不会漂移**：
# 以后要调就只改这一处。`x-` 开头的顶层键是 compose 规范允许的扩展字段，会被忽略。
x-logging: &logging-limits
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: reseed-prowlarr
    env_file: [.env]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      # ./ = compose 文件所在目录 = NAS compose 根（改名后 /volume2/docker_ssd/reseed）；
      # ★ 2026-10-05（B2）：容器相关目录已收进 `data/` ⇒ 挂载源加 `data/` 前缀。
      - ./data/prowlarr:/config
    ports:
      - "9696:9696"
    networks: [reseed-net]
    logging: *logging-limits
    restart: unless-stopped

  # 可选：中文站过 Cloudflare 用；不需要就删掉本段（并去掉 Prowlarr 里的代理设置）
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: reseed-flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks: [reseed-net]
    logging: *logging-limits
    restart: unless-stopped

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: reseed-cross-seed
    # 以媒体属主身份运行，保证建出来的硬链接属主/权限与大包一致
    user: "${PUID}:${PGID}"
    env_file: [.env]
    environment:
      - TZ=${TZ}
      - CONFIG_DIR=/config
      # 供 cross-seed/config.js 读取（见该文件顶部说明）
      # qbittorrent-reseed 在它自己 compose 栈的网络里（qbittorrent-reseed_default）。
      # 本服务已接入该网络(qbit-net)，用服务名直连；不要改回 ${NAS_IP}，群晖上
      # 「容器→宿主机 LAN IP→DNAT 回另一容器」的回环会 timeout（2026-09-11 实测）。
      - QBIT_URL=http://qbittorrent-reseed:3060
      - TORZNAB_URLS=${TORZNAB_URLS}
      - DATA_DIRS=${DATA_DIRS}
      - LINK_DIR=${LINK_DIR}
      - LINK_TYPE=${LINK_TYPE}
      - MATCH_MODE=${MATCH_MODE}
      - SKIP_RECHECK=${SKIP_RECHECK}
      - QBIT_CATEGORY=${QBIT_CATEGORY}
      - CROSSSEED_API_KEY=${CROSSSEED_API_KEY}
    # ★★ 不直接起 daemon —— 改走**启动闸门**（见 cross-seed/wait-for-qb.sh）：
    #   先等 qbittorrent-reseed 就绪再起 daemon，吸收「daemon 启动时必须登录 qB 校验配置」
    #   与「qb 在另一个 compose 项目、depends_on 跨不了项目」之间的竞态。
    #   不做这层的后果：qb 未就绪 ⇒ daemon 重试 6×60s ⇒ exit 0 ⇒ restart 拉起 ⇒ **无限重启循环**
    #   （`ERR-DOCKER-13`，2026-10-01 实测 `RestartCount=44`）。闸门脚本**带硬超时、绝不无限挂起**。
    #   ★★ 必须用 **`entrypoint:`** 而不是 `command:`（NAS 首部署**实测**踩到）：
    #      本镜像的 ENTRYPOINT 是 `catatonit -- /usr/local/bin/cross-seed`
    #      ⇒ `command: ["sh", ...]` 会被当**参数**喂给 `cross-seed` ⇒
    #      `error: unknown command 'sh'` ⇒ 崩溃循环。覆盖 entrypoint 才是"换掉要跑的东西"。
    #   ★ 改这里**必须 `--force-recreate`** 才生效（`entrypoint:` 变了，见 `ERR-DOCKER-01`）。
    entrypoint: ["/bin/sh", "/config/wait-for-qb.sh"]
    volumes:
      - ./data/cross-seed:/config
      # ★大包源数据 + 建链接目录：两者必须在同一物理卷，且此处 1:1 挂载
      - /volume1/video:/volume1/video
    ports:
      - "2468:2468"
    depends_on: [prowlarr]
    # ★★ 2026-10-05（B6 上线实测）：给 cross-seed 在 **qbit-net 上钉一个固定 IP**。
    #   起因：qB 的 WebUI 有 `web_ui_max_auth_fail_count=5` + `web_ui_ban_duration=3600`
    #   —— **按来源 IP 封禁**。cross-seed 起来后若反复用**同一个** 172.29.0.x 登录失败
    #   （首部署时 qB 白名单没有 172.x、且我们还没注入凭据 ⇒ 必然失败），那个 IP 就被
    #   qB 封 1 小时；此后即使凭据正确，**同一个 IP 仍吃 403**
    #   （实测：直连返回体 =「身份认证失败次数过多，您的 IP 地址已被封禁」）。
    #   ★ Docker 的 IPAM 会**优先复用**上次那个 IP ⇒ 光 `--force-recreate` 换不掉它，
    #     必须显式钉一个地址。钉在 `.10`（当前 .2=qB/.4=drive-loop/.5=qbit_manage 之外）。
    #   ★ 这是**我们自己的 compose** 的改动，**不碰 qB 的 conf**（用户硬约束）。
    #   ★ 反向：`wait-for-qb.sh` 会真登录校验（`QBIT_URL_CRED`），一旦某 IP 被封它只会
    #     "继续等"到 300s 超时 —— 所以固定 IP 也便于**人一眼看出**是哪个地址被封。
    networks:
      reseed-net: {}
      qbit-net:
        ipv4_address: 172.29.0.10
    logging: *logging-limits
    restart: unless-stopped

  # 一次性 CLI：默认只做只读预检；实际匹配请用 `docker compose run ... run`
  reseed-orchestrator:
    build:
      context: .
      dockerfile: data/orchestrator/Dockerfile
    image: isunker/reseed-toolkit-orchestrator:dafe474
    container_name: reseed-orchestrator
    user: "${PUID}:${PGID}"
    env_file: [.env]
    environment:
      - TZ=${TZ}
      - NAS_IP=${NAS_IP}
      - RESEED_CONFIG=/config/config.yml
      # `state` 子命令只读的那个 sidecar 状态库（真实位置不在 /config 下，见下）
      - RESEED_STATE_DB=/state/state.db
      # ★★ 2026-10-04：qB 只读 API Key（同 drive-loop 处那条注释）。编排器
      #   `state` 子命令读 qB 时也走 `state._qbit_*` ⇒ 一并带上。
      - QB_API_KEY=${QB_API_KEY:-}
    volumes:
      # 编排器(autohardlink)的配置目录 = ./data/hlink；把 config.yml 放进 hlink/ 即可。
      # 注意：这里只放"配置/日志"等元数据，真正的硬链接数据在 LINK_DIR(/volume1/video 下)。
      - ./data/hlink:/config
      # ★ 2026-09-12 下午加：状态库**不在** /config 里 —— ./data/hlink 是编排器自己的配置目录
      #   （只有 config.yml），而 drive-loop 真正在写的那份在 <compose>/data/drive-loop/state/hlink/。
      #   ★ 2026-10-05（B2）：运行态统一收进 `data/drive-loop/state/` ⇒ 这条挂载源随之改。
      #   ★ 挂成 **ro**：`state` 只读；而 StateStore 打开库时会跑一遍 schema 迁移
      #   （`ALTER TABLE ...`），rw 挂载等于让一个"只读"子命令**有写坏生产库的能力**。
      #   ro 把这条可能性直接掐掉，顺带也是给 `state` 的语义做背书。
      - ./data/drive-loop/state/hlink:/state:ro
      # 预检要 stat 源目录/校验同卷；prestage 要建链接 → 同样 1:1 挂载媒体卷
      - /volume1/video:/volume1/video
    depends_on: [cross-seed]
    networks: [reseed-net, qbit-net]
    logging: *logging-limits
    restart: "no"

  # ------------------------------------------------------------------ #
  # drive-loop：容器**自带常驻 while 循环**的跑批驱动（`#58`，C 方案）
  #
  #   ★★ 它默认**不会**被 `docker compose up -d` 拉起来 —— 见下面 `profiles`。
  #
  # 它取代了什么
  # ------------
  #   取代「DSM 任务计划每 15 分钟唤醒一次 `drive-loop/run.sh`（带 `--once`）」。
  #   入口是 `drive-loop/run-resident.sh`（仓库里 `scripts/drive-loop-resident.sh`），
  #   **不带** `--once` —— 循环在 python 里，DSM 那侧只管"容器还活着吗"。
  #
  # ★★ 启用前**必须**先在 DSM 里停掉那个跑 `run.sh` 的任务
  # ------------------------------------------------------
  #   两条路**没有任何跨进程互斥**（`§26.5` 前提 ②）：同时发 webhook ⇒
  #   一次 429 可能废掉几百条（README 坑 4）。
  #   ★ 它比"两个同类进程"更隐蔽：**两边写的东西不一样**
  #     （常驻写 `mode=resident`、`--once` 不写 mode）⇒ 改之前从状态文件上
  #     **根本看不出有两个在跑**。`#58` 的 15.a 修复给常驻分支补了 mode 与心跳，
  #     就是为了让这件事**能被看出来**。
  #   ⇒ 启用是**两步**、且**顺序不能倒**：
  #       ① DSM → 控制面板 → 任务计划：停掉「驱动跑批」那条（见 README 部署表）
  #       ② docker compose --profile drive-loop up -d drive-loop
  #   ⇒ `run-resident.sh` 自己还有一道前置闸门（读到"另一条路在跑"就退出，码 3），
  #     但它只是**兜底**：`mode=resident` 时它无法区分"上一轮残留"与"另一个常驻"。
  #     **别把兜底当主闸。**
  #
  # ★ 为什么 `build:` 不写 —— 这条是硬约束
  # ---------------------------------------
  #   本仓的 docker build 上下文是**仓库根**，而 NAS 上的构建上下文是 **compose 目录**
  #   （`docker compose build` 在 NAS 上是从 compose 文件所在目录起步）。两边相对路径
  #   不同 ⇒ 写 `build:` 会在 NAS 上 build 失败。镜像 `reseed-drive-loop:0.1.0` 已在
  #   本机 build 并 `docker load` 到 NAS（`§26.5` 表），**只 load 不 build**。
  #   ★ 同一条约束也记在 `scripts/check-deploy-drift.py` 的 LOCAL_ONLY 里
  #     （`drive-loop.Dockerfile` 那条）。
  #
  # ★ 挂载为什么是**整目录 1:1**、不是挑几个子目录
  # ---------------------------------------------
  #   代码里的路径**全是绝对路径**：`CROSSSEED_DIRS[0]`（硬编码）、
  #   `build-farm.sh` 的 `COMPOSE_DIR`、`--env "$COMPOSE_DIR/.env"`、告警出栈口
  #   `notify/spool/`、以及 `ROOT = HERE.parent` 那条推导。
  #   ⇒ **挑着挂不会报错，只会静默退化**（`first_existing()` 返回 `None` + 一行 warning）。
  #   ★ 最容易漏的是 `drive-loop/scripts/` 下的 `.state` 文件（**不在** `hlink/` 里），
  #     漏了的后果是**静默**的：对账 / 无人认领的基线会被当成「首次读数」重新记一遍。
  #     ★ 2026-09-17 更正：这里原写「**五个**」，**实测是六个** ——
  #       `.daily-report` / `.drive-loop` / `.farm-check` / `.linkguard` / `.notify` / `.reconcile`。
  #       其中 `.linkguard.state` 最大（约 **827 KB**，那是基线本身）。
  #       ⇒ 清单以 `scripts/chk58.sh` 的 `[3]` 段为准（它会逐个点名 + 报字节数）。
  #
  # ★★ 爆炸半径（写明，不是没看见）
  # -----------------------------
  #   挂整个 compose 目录 = 把 `.env`、`prowlarr/`（cookie + db）、
  #   `cross-seed/`（含 API key）、`notify/notify.conf`（邮箱口令）一并交给这个容器。
  #   ★★ 2026-10-04 更新：通知模块已整体剥离（`重构方案.md` §11）⇒ 本条里
  #     `notify/notify.conf` 这份"邮箱口令"**随之迁出**（NAS 侧发信脚本仍读 DSM
  #     自己的 SMTP 配置）。挂载仍是整目录 1:1 未改（那是 push/pull 重构的事）。
  #   但**不能**减小半径。
  #
  # ★ 用户与属主：**不加 `user:`**（与另外三个服务不同，这是刻意的）
  # -------------------------------------------------------------
  #   宿主那份 `run.sh` 由 DSM 以 **root** 跑 ⇒ 它写下的 `.drive-loop.state`、
  #   `attempts.log`、`drive-loop.log` 属主都是 root。容器这边若切成 `${PUID}:${PGID}`，
  #   同一个文件就会**两个属主换来换去**，其中一边必然写不进去。
  #   ⇒ 两边**同为 root**，一致。（`drive-loop-docker.sh` 头部"还没验的三件事 ③"记的就是这条。）
  #   ★ 代价：容器里跑的代码是 root。它的动作面是 `--url`/`--qbit-url`（HTTP）+
  #     写 `$COMPOSE_DIR` 与 `/volume1/video` 下的文件（建硬链接、农场目录）。
  #     这些**本来**就在 root 的权限下发生（宿主那份也是 root），所以这不是**新增**权限，
  #     只是把同一权限挪了个地方。
  #
  # ★ 网络要**两个** —— 和 `cross-seed` 同形，别猜网络名
  # ------------------------------------------------
  #   `cross-seed` / `prowlarr` 在 `reseed-net`；`qbittorrent-reseed` 在 `qbit-net`
  #   （=`qbittorrent-reseed_default`，external）。两条缺一不可：
  #   少了 reseed-net 连不上 `cross-seed:2468`，少了 qbit-net 连不上
  #   `qbittorrent-reseed:3060`。★ 别改成 `${NAS_IP}` —— 群晖上
  #   「容器 → 宿主机 LAN IP → DNAT 回另一容器」会 timeout（README 坑 4）。
  #
  # ★ 接线与迁移状态：README「还没做」第 15 条 + `summary/26-...md` §26.5
  # ------------------------------------------------------------------ #
  drive-loop:
    image: isunker/reseed-toolkit-drive-loop:388ea0d
    container_name: reseed-drive-loop
    # ★★ 「生效但不自动上线」的安全锁（`#58` 的 15.a 修复之外的第二条前提）。
    #   带 profile 的服务，`docker compose up -d` **默认不启动**；
    #   必须 `docker compose --profile drive-loop up -d drive-loop`。
    #   ⇒ 于是：代码就绪、进白名单、`deploy.sh` 会推，但**不会被任何人顺手拉起来**。
    #     要启用必须显式打那条命令 —— 而那一步的前置是**先在 DSM 里停掉 run.sh 任务**。
    #   ★ profile 名与 service 名同名**是巧合**：它的语义是
    #     「**这是需要人工显式决策的第二条路**」，不是分类标签。
    #   ★ 不给别的服务加 profile（否则它们会被一起锁住，那是另一种事故）。
    profiles: ["drive-loop"]
    # 常驻服务 —— 同 `cross-seed`。
    # ★ 它只对**退出**生效。**「卡死」（进程活着、不干活）不触发它** ——
    #   那种情形靠下面 `healthcheck` + `autoheal` 侧车（2026-09-17 已加）。
    restart: unless-stopped
    # ★★ healthcheck：判据取**心跳新鲜度**（15.a 修好的 `.drive-loop.state` 的
    #   `heartbeat_ts`）。这是本仓**第一个** healthcheck。
    #   ★ 为什么用 python 而不是 sed/grep 抠 JSON：镜像就是 python:3.12-slim
    #     （python 一定在），而本仓**踩过一次**「sed 抠 JSON 静默抠错」
    #     （`drive-loop-resident.sh` 闸门里那句注释），且 `tests/README.md`
    #     有「**别让判据需要转义**」这条。
    #   ★★ 阈值 900s **故意比 `batch_alive()` 的 `HEARTBEAT_STALE_SEC`(600s) 松**：
    #     healthcheck ⇒ 要不要**重启容器**（重动作，宁晚不误杀）；
    #     `batch_alive` ⇒ 要不要**跳过本轮**（轻动作）。两者权衡方向不同。
    #   ★★★ 2026-09-18 **实测踩坑并改正**：900s 这个值**会误杀健康的容器**。
    #     机理：`Heartbeat` 原本只包住**跑批**，睡眠期（日志「等待 45.0 分钟后
    #     跑下一批」）心跳**冻结** ⇒ 45 分钟 ≫ 15 分钟 ⇒ **每一轮**都判 unhealthy
    #     ⇒ autoheal 杀容器 ⇒ `restart: unless-stopped` 拉起 ⇒ 群晖按退出码报
    #     「**drive-loop 意外停止**」，**每 41 分钟一封邮件**。
    #     ⇒ 两条一起改（缺一不可，见 SUMMARY）：
    #       ① `drive-loop.py` 的睡眠期也刷心跳（新增 `phase` 字段区分「在睡/在跑」）；
    #       ② 这里把阈值抬到 **1800s**，给「单批跑得比预期久」留余量。
    #     ★ 判据要能被证伪：改完若**仍**每 41 分钟一封，说明诊断错了 ⇒ 回滚重查。
    #   ★★ `start_period: 120s` **必须有**：容器刚起来时状态文件还没写，
    #     判据会失败 ⇒ 没有它则开局即判 unhealthy ⇒ 被 autoheal **反复重启**。
    #     ★ 注意这条注释当初只想到了「**开局**」那个窗口 —— 2026-09-18 才发现
    #       「**每轮睡眠**」是**另一个**窗口，而且它比开局长得多（45 分钟）。
    #   ★ 这条判据**查不出**「容器从没起来过」：那种情形 `docker ps` 的 STATUS
    #     会说话（见 README 15.d 的收尾核对），不由 healthcheck 负责。
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,sys,time;st=json.load(open(sys.argv[1],encoding='utf-8'));hb=float(st.get('heartbeat_ts') or 0);sys.exit(0 if hb and time.time()-hb<=1800 else 1)",
             "/state/.drive-loop.state"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # ★★ 这个 label 是 **autoheal 侧车的唯一作用域开关** —— 没有它，
    #   下面那个容器**不会**管 `drive-loop`（autoheal 默认只治带此 label 的容器）。
    labels:
      - autoheal=true
    env_file: [.env]
    environment:
      - TZ=${TZ}
      # 容器方言 ①：镜像里没有 /usr/bin/python3（那是 DSM 自带的），python 在 PATH 上
      - PY=python
      # 容器方言 ②：镜像里没有 sudo，而 build-farm.sh 用 `${SUDO-sudo}` ——
      #   给空串它就跳过 sudo 直接跑（那步本来也 `|| true`）
      - SUDO=
      # ★★ 两个**运行时覆盖口**（2026-09-22 加）—— 让「名单」「额度」不用改代码、不用重建镜像
      #    ★ 起因：`run-resident.sh` **不传** `--packs`，所以容器的名单 = `drive-loop.py`
      #      的 `PACKS_DEFAULT`；而我把那个默认值从 3 个包缩到 1 个之后，NAS 上要生效
      #      **必须重新部署 + 重启容器**。有了 `DRIVE_PACKS`，改名单变成"改这里 + 重启"。
      #    ★ `DRIVE_LIMIT` 同理：入口脚本写的是 `--limit "${DRIVE_LIMIT:-500}"`
      #      （`--pool` 下是**全局**额度，池子欠账实测 565 ⇒ 50 会让每批重跑同一批头部）。
      #    ★ 两边默认值**与代码逐字相同** ⇒ 不给 env 时行为不变（不制造新的漂移点）。
      #    ★★ 必须写在 `environment:` 里 —— **这里**才是键值对的地盘：
      #      我第一版把它写进了 `volumes:` 下面，而 **YAML 不报错**、Docker 也**不报错**
      #      （短语法挂载是 `源:目标`，`DRIVE_PACKS=xxx` 看着就像一条合法相对路径挂载）
      #      ⇒ 结果是"改了 compose、什么也没发生"，而且**顺手少挂了两个目录**。
      #      ★ 这正是 `A.11` 那个形状（"参数看着生效、其实没生效"）；逮住它的是
      #        `tests/test_drive_loop_service.py` ①k 那条**逐条**挂载断言。
      - DRIVE_PACKS=${DRIVE_PACKS:-frds-top250-2024}
      - DRIVE_LIMIT=${DRIVE_LIMIT:-500}
      # ★★ 2026-10-04：qB 的 API Key —— 只读访问 :3060 用（`Authorization: Bearer`）。
      #   本服务读 qB（回灌 / 卡999 / 卡种 / IYUU / 链接守护）走 `state._qbit_*`，
      #   那些函数现在会带上这个头（见 `orchestrator/state.py::_qb_auth_header`）。
      #   ★ `env_file: [.env]` 其实已经带进来了，这里显式写一条是**为了能被搜到/读见**。
      #   ★ 空值也 OK：没有 key 时行为与改动前逐字相同（白名单模式不受影响）。
      - QB_API_KEY=${QB_API_KEY:-}
      # ★★ 2026-10-05（B2/§8.3，代码入镜像）：代码改从**镜像**读 ⇒ 路径来源由
      #   「`$0` 反推 compose 目录」改为下面三条**显式环境变量**（详见 `drive-loop.py`
      #   的 STATE_DIR 段 / `run-resident.sh` 的文件头）。三者的**含义与取值**：
      #     · DRIVE_STATE_DIR —— 运行态目录（6 个 `.state` + attempts.log + drive-loop.log
      #       + `hlink/state.db`）。挂在 `/state` ⇒ 取值 `/state`。
      #     · COMPOSE_DIR     —— cross-seed compose 根（`CROSSSEED_DIRS` 读它找
      #       `cross-seed.db` / `info.current.log` / `build-farm.sh` / `.env`）。
      #       ★ 改名后的新根 = `/volume2/docker_ssd/reseed`。
      #     · RESEED_STATE_DB —— sidecar 状态库全路径（编排器的 `state` 子命令读同一份）。
      #   ★ 改这三者**不用重建镜像** —— 它们是运行时注入；而**改了 drive-loop 代码**
      #     才要重建（见 `.claude/rules`「代码定位」）。
      - DRIVE_STATE_DIR=/state
      - COMPOSE_DIR=/volume2/docker_ssd/reseed
      - RESEED_STATE_DB=/state/hlink/state.db
    volumes:
      # ★★ 2026-10-05（B2/§8.3）：挂载清单按「代码入镜像」模型重写（原来是整目录 1:1）。
      #   ① compose 根：**只读**挂进来（代码不再取自这里 ⇒ 不必可写）。
      #      用途 = 让 `CROSSSEED_DIRS` 读到 cross-seed.db / info.current.log /
      #      build-farm.sh / .env（`first_existing()` 那四处）。★ 用绝对路径字面量
      #      （= 新根），**不用 `./`** —— 要求宿主路径与容器内路径**逐字相同**。
      - /volume2/docker_ssd/reseed:/volume2/docker_ssd/reseed:ro
      #   ② 运行态卷：6 个 `.state` + attempts.log + drive-loop.log + `hlink/state.db`
      #      都是**运行时产物**，必须挂一个**可写**目录（镜像层只读，写不进去）。
      #      ★ 容器内 = `/state`，与上面 `DRIVE_STATE_DIR` 一致。
      - ./data/drive-loop/state:/state
      #   ③ 媒体卷，同名同路径；**§9：硬链接不能跨卷** ⇒ 农场与源数据必须同一条设备，
      #      所以这个挂载**只能是整卷**。
      - /volume1/video:/volume1/video
      # ③ 时区：挂 NAS 的 `/etc/localtime`（2026-09-21 加）
      #    ★★★ 2026-09-22 **更正起因**：原先这里写「日志时间戳比真实时间快 8 小时」，
      #      **那是错的** —— 我把本机（Windows，**本来就是东八区**）的 `18:02`
      #      当成 UTC 去和 NAS 的 `02:09` 比，才算出"差 8 小时"。
      #      用户实测：`date -u` = `18:10 UTC`、`date -R` = `02:10 +0800` ——
      #      **NAS 的时钟、时区、容器时间一直是对的**。（详见 `§26.46`）
      #    ★★ 结论：**这个挂载不是修 bug 用的**，它只是"跟随 NAS"这个偏好。
      #      留着是因为它**无害且确实让容器跟随 NAS**（read-only，不需要重建镜像
      #      —— 本项目有「只能本地 build + `docker load`」的硬约束，装 tzdata 会破它）。
      #      ★ 要撤它就单独撤：`git revert 646be99` 里那两行，并**顺手在容器里
      #        再确认一次 `date` 与 NAS 一致**（★ 别再基于推断动手 —— 这次就是如此）。
      #    ★★ 副作用（写明）：容器从此**跟随 NAS 时区**，`TZ` 环境变量不再说了算。
      #      要改时区就改 NAS，别改这里。
      - /etc/localtime:/etc/localtime:ro
      # ④ ★★ 2026-09-22 **已删** `- /etc/timezone:/etc/timezone:ro`
      #    ★ 实测 NAS 上**没有** `/etc/timezone` 这个文件
      #      （容器里 `cat /etc/timezone` 报 `No such file or directory`）。
      #    ★★ Docker 挂一个**不存在的宿主文件**时不会报错，而是**建一个空目录**顶上
      #      ⇒ 容器里 `/etc/timezone` 变成一个**空目录** ⇒ 纯负担、零收益。
      #    ★ 文档与实际**不一致**本身就是缺陷（`B.10`）—— 所以这里删掉并留痕，
      #      而不是"反正不影响"就这么放着。
    # ★★ 这里必须是 `entrypoint:`，**不是 `command:`** —— 2026-09-17 实测踩过：
    #   镜像的 `ENTRYPOINT ["python", "/app/scripts/drive-loop.py"]` **不会被 command 覆盖**
    #   （`command:` 只替换 **CMD**）⇒ 写成 `command: ["sh", "...run-resident.sh"]` 时，
    #   实际执行的是
    #       python /app/scripts/drive-loop.py sh drive-loop/run-resident.sh
    #   ⇒ argparse 报 `unrecognized arguments: sh drive-loop/run-resident.sh`
    #   ⇒ 退出码 2 ⇒ 被 `restart: unless-stopped` **每 ~10 秒重启一次**，
    #     而 attempts.log 里 **`[resident]` 一行都不写**（根本没跑到那个脚本）。
    #   ★ 症状极像"路径不对"，其实**是 ENTRYPOINT 没被覆盖** —— 先看 `docker logs`。
    #   ★ 对照：`reseed-orchestrator` 用的是 `command: daemon`，那**是对的** ——
    #     它的 entrypoint 是 `python -m orchestrator.main`，`daemon` 是**子命令参数**；
    #     而这里要的是**整条替换**，所以用 `entrypoint:`。
    #
    # ★ 路径写成**绝对**的：镜像的 `WORKDIR` 是 `/app`。
    # ★★ 2026-10-05（§8.3，代码入镜像）：入口**从镜像里取** —— `/app/run-resident.sh`
    #   由 `drive-loop.Dockerfile` 的 `COPY data/drive-loop/run-resident.sh /app/run-resident.sh`
    #   带进镜像。⇒ 不再从挂载区读（"挂载盖住镜像"那条病根消失）。
    entrypoint: ["sh", "/app/run-resident.sh"]
    networks: [reseed-net, qbit-net]
    logging: *logging-limits

  # ------------------------------------------------------------------ #
  # autoheal：**卡死接管**侧车（`#58`，2026-09-17 加）
  #
  #   为什么必须有它（而不是"配个 healthcheck 就完事"）
  #   ------------------------------------------------
  #   `restart: unless-stopped` 只对容器**退出**生效。**卡死**（进程活着、
  #   心跳停了、但不退出）**不会**触发任何重启 ⇒ 得有人看着 `unhealthy` 并动手。
  #   Docker 自己没有这个能力 ⇒ 要么这个侧车，要么 DSM 轮询 `docker inspect`。
  #   ★ 15.a 把 `heartbeat_ts` 补上之后，**判据才存在**（之前没有它可判）。
  #
  # ★★ 为什么带 `profiles`（**与 drive-loop 同一个**）
  # ------------------------------------------------
  #   不带 ⇒ `docker compose up -d` 会**单独**把它拉起来，而它要治的容器
  #   （`drive-loop`）**还没启用** ⇒ 一个空转的、**握着 docker.sock** 的容器。
  #   带上同一个 profile ⇒ **两者同生同死**，启用仍是那一条显式命令：
  #       docker compose --profile drive-loop up -d drive-loop autoheal
  #
  # ★★ 爆炸半径（这是本次**最大的新增风险**，写明不是没看见）
  # ------------------------------------------------
  #   `/var/run/docker.sock` ≈ **root 等价** —— 挂它的容器能创建/删除/exec
  #   **任何**容器。★ 本仓此前**没有任何东西**挂过这个 socket（我 grep 过）。
  #   缓解三条，缺一不可：
  #     ① 挂成 **`:ro`**（只读挂载 —— autoheal 只需读状态 + 发 restart 请求）；
  #     ② `AUTOHEAL_CONTAINER_LABEL=autoheal` ⇒ **只治带了那个 label 的容器**，
  #        即**只有 `drive-loop` 一个**（不是"治好一切"）；
  #     ③ `profiles` 锁 ⇒ 它的生命周期由人的显式决策决定。
  #   ★ 代价仍然写着：**它一旦起来，就能碰这台 NAS 上的所有容器。**
  #
  # ★ 镜像标：`willfarrell/autoheal:latest`
  #    ★★ 本机（Windows，写这个文件时）**无法联网核实**该 tag 与那几个 env 的
  #      默认值 —— 所以**这一条是待验的**。落地时先在有网的机器 / NAS 上跑
  #      一下 `docker pull willfarrell/autoheal:latest`（或 `docker manifest inspect`）
  #       确认标存在，再把**实测到的 tag 与 digest 写回这里**。
  #    ★ NAS 能拉镜像（`ghcr.io/flaresolverr/flaresolverr:latest` 成功拉过 12 层，
  #      见 README），所以走 `docker compose` 时它会自动拉，不需要手工 `docker load`。
  #
  # ★★★ 2026-09-18 夜：这条链**已在同架构本机替身上端到端验通**（三轮可重复）
  #   —— 见 SUMMARY §26.16。两个读数留下来给下次用：
  #     ① 「卡死 → 被接管」的**最坏时延 ≈ 30.7 分钟**
  #        = 1800s（判 unhealthy，含 interval×retries）+ 30s（AUTOHEAL_INTERVAL）
  #          + 10s（stop timeout）。★ 这个数此前没人算过 ⇒ 判"够快吗"时有据可依。
  #     ② ★★ **要复现，别用 `docker pause`**：它会把 healthcheck 的 `exec`
  #        一起冻住 ⇒ 测的是"healthcheck 也卡了"，**验不出**这条链。
  #        正确造法：让**应用自己停心跳**（心跳年龄越过阈值即可）。
  # ------------------------------------------------------------------ #
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: reseed-autoheal
    profiles: ["drive-loop"]
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # ★ 作用域：只治带 `autoheal=true` label 的容器（= 只有 drive-loop）
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # 巡检间隔（秒）；30s 足够，不必更快
      - AUTOHEAL_INTERVAL=30
      # 启动后先等一会儿再开始判 —— 与上面 healthcheck 的 start_period 同理
      - AUTOHEAL_START_PERIOD=120
    volumes:
      # ★ 只读挂载（见上面「爆炸半径」）。★ 路径用字面量 /var/run/docker.sock：
      #   群晖上它就是这个位置（不是 /run/docker.sock）。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [reseed-net]
    logging: *logging-limits

  # watcher：**容器巡检拉起件**的常驻运行时（2026-09-29 加）
  #
  #   为什么需要它（与 autoheal 的分工，别混）
  #   ------------------------------------------------
  #   `autoheal` 治「**卡死**」（进程活着、心跳停、但不退出）；
  #   `watcher` 治「**没起**」——`exited` / `created` / 被 stop 过 / **从没启动**。
  #   两者**不重叠、不打架**：watcher 只对"不在跑"动手（`up -d`），
  #   对"在跑但不 healthy"**只报不动手**（那是 autoheal 的地盘）。
  #
  # ★★ 为什么它**必须**是「另一个容器」而不是"在某个业务容器里跑"
  #   ------------------------------------------------------------
  #   它要拉起的是**别的**容器。若它跑在业务容器里，那个业务容器一停
  #   ⇒ **看护件跟着死** ⇒ 谁也救不了。（这正是 2026-09-27 那次停 29 小时
  #   的形状：`dockerd` 重启 ⇒ 全停 ⇒ 没人拉起。）
  #   ⇒ 它必须是**独立**的一支，且**用 `restart: always`**：
  #     ★ 业务容器**不能**用 `always`（那会让 `docker stop` 停不住）；
  #       而**监视器**用它恰好对 —— **它就该停不住**，因为 `dockerd` 重启后
  #       `unless-stopped` **不会**把它拉回来（那正是本次要补的洞）。
  #
  # ★★ 爆炸半径（本仓**第 2 个**挂 docker.sock 的容器，第 1 个是 autoheal）
  #   --------------------------------------------------------------------
  #   `/var/run/docker.sock` ≈ **root 等价**。缓解四条：
  #     ① 挂成 **`:ro`**（与 autoheal 同规格）；
  #     ② 它**只做两件事**：`docker inspect` 读状态 + `docker compose up -d` 拉起
  #        —— 脚本里**没有** exec / rm / stop 任何容器（动作分档见其文件头）；
  #     ③ `profiles` 锁 ⇒ 生命周期由人的显式决策决定（与 drive-loop / autoheal 同一条）；
  #     ④ **写死的四个容器名**（不是"治好一切"）—— 只有那四个会被它关注。
  #   ★ 代价仍写着：**它一旦起来，就能碰这台 NAS 上的所有容器**（与 autoheal 同）。
  #
  # ★★★ 镜像与挂载：**三条实测结论**（2026-09-29 在 NAS 上验证，别想当然）
  #   ------------------------------------------------------------------
  #   ① 用 **`python:3.12-slim`**（Debian/glibc）——**不是 alpine**。
  #      ★ 实测：群晖的 `docker` / `docker-compose` 是 **glibc 动态链接**的，
  #        `alpine`（musl）里跑会报 `no such file or directory`（缺 loader）。
  #        `python:3.12-slim` 已在 NAS 上（drive-loop 的底座），**不用新拉镜像**。
  #   ② **docker 与 compose 都不在镜像里** ⇒ 从**宿主机**挂进来（走只读）：
  #        · `/usr/local/bin/docker` 是**符号链接**，指向
  #          `/var/packages/ContainerManager/target/usr/bin/docker` ⇒ **要挂真身**；
  #        · compose 插件同理（真身 `.../usr/bin/docker-compose`），挂到
  #          `/usr/local/lib/docker/cli-plugins/docker-compose` —— **实测这个位置才会被发现**
  #          （`/usr/local/libexec/...`、`/usr/lib/...` 都试过，都不认）。
  #      ★ 用 `python:3.12-slim` 当底 = 与宿主同为 glibc ⇒ 直接可执行。
  #   ③ compose 目录挂**与宿主完全相同**的路径（不是 `/app`）：
  #      因为本容器通过 socket 让**宿主 daemon** 干活，而 compose 文件里写的是
  #      **宿主路径** ⇒ 路径不一致会让它解析出错误的挂载。
  #      （`drive-loop` 也挂同一路径，同一理由。）
  #
  # ★ 为什么 `command` 是那个循环脚本而不是一次性：见 `watch-containers-loop.sh` 头注。
  #   ★★ 那条循环**故意不因单轮失败而退出** —— 否则一次"拉不起来"会变成
  #      「容器反复重启」（`restart: always` 会一直拉它），故障被放大。
  watcher:
    image: python:3.12-slim
    container_name: reseed-watcher
    # ★ 与 drive-loop / autoheal 同一个 profile ⇒ **同生同死**，
    #   启用仍是那一条显式命令（不会被 `docker compose up -d` 顺手拉起来）。
    profiles: ["drive-loop"]
    # ★★ `always` 而不是 `unless-stopped`：见上面那段理由（要它"停不住"）。
    restart: always
    environment:
      - TZ=${TZ}
      # 巡检间隔（秒）。10 分钟：告警有"同日同容器只投一次"的冷却 ⇒ 频率不影响告警量；
      # 而 drive-loop 一轮是分钟级 ⇒ 10 分钟足够覆盖「停了没人管」这个窗口。
      - WATCH_INTERVAL=600
      - WATCH_COMPOSE_DIR=/volume2/docker_ssd/reseed
      # ★★ 2026-10-04：通知模块已整体剥离（见 `重构方案.md` §11）。`NOTIFY=0` ⇒
      #   巡检**照样拉起容器**，但**不往 spool 投告警**。默认 `1`（保留投递能力）。
      #   ★ 等项目 B（邮件通知告警）接管告警编排后，把这里改成 `NOTIFY=0`；
      #     现在先留 1，让 NAS 上仍留着的 `notify-spool.sh` 继续发巡检告警。
      - NOTIFY=${NOTIFY:-1}
      # ★★ 2026-10-01：项目 B（qbittorrent-reseed）的 compose 目录 —— 看护器现在也盯
      #   `qbittorrent-reseed`（它原不在本栈，停摆 3h47m 没人拉起）。两条 `up -d` 要在
      #   **各自的目录**里跑（项目 A 有 profile、项目 B 没有），故两个目录都要挂进去。
      #   与下面 ③ 同一条规则：**与宿主完全相同**的路径。
      - WATCH_COMPOSE_DIR_QB=/volume2/docker_ssd/qbittorrent-reseed
    volumes:
      # ① socket（只读，与 autoheal 同规格）
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ② 宿主机的 docker + compose 插件（真身；见上面★★★ ②）
      - /var/packages/ContainerManager/target/usr/bin/docker:/usr/local/bin/docker:ro
      - /var/packages/ContainerManager/target/usr/bin/docker-compose:/usr/local/lib/docker/cli-plugins/docker-compose:ro
      # ③ compose 根，**同路径**（读 compose.yaml）（见上面★★★ ③）
      #    ★ 2026-10-05（B2）：改名后新根 = /volume2/docker_ssd/reseed。
      - /volume2/docker_ssd/reseed:/volume2/docker_ssd/reseed
      # ④ ★★ 2026-10-01：项目 B 的 compose 目录，**同路径**挂载（同 ③ 的规则）。
      #   不挂它 ⇒ 脚本第 431 行的 `COMPOSE_FILE_QB` 探测恒失败 ⇒ 每趟报"找不到 compose 文件"，
      #   而 qb 真停了时**拉不起来**。这是"看着绿其实没能力"的典型（A.11 / B.10 第 14 条）。
      - /volume2/docker_ssd/qbittorrent-reseed:/volume2/docker_ssd/qbittorrent-reseed
    working_dir: /volume2/docker_ssd/reseed
    # ★ 入口是那个循环；`sh` 显式写出（镜像的 entrypoint 不保证有 sh 之外的假设）。
    #    ★ 2026-10-05（B2）：脚本收进 `data/scripts/diag/` ⇒ `working_dir` 下的相对路径随之加 `data/`。
    command: ["sh", "data/scripts/diag/watch-containers-loop.sh"]
    networks: [reseed-net]
    logging: *logging-limits

networks:
  reseed-net:
    driver: bridge
  # qbittorrent-reseed 由它自己的 compose 栈创建的网络，这里以 external 接入，
  # 使 cross-seed / 编排器能用服务名直连 :3060（源 IP 为 172.x，已被 qB 的
  # AuthSubnetWhitelist 172.16.0.0/12 覆盖）。
  qbit-net:
    external: true
    name: qbittorrent-reseed_default
